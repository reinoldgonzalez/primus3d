<body>
<div id="app" data-view="plan">
  <header id="top">
    <button id="menuBtn" class="ib" aria-label="Menu">☰</button>
    <button id="pname" class="pname">Untitled</button>
    <span id="saved" class="saved"></span>
    <div class="sp"></div>
    <button id="undo" class="ib" aria-label="Undo" title="Undo">↶</button>
    <button id="redo" class="ib" aria-label="Redo" title="Redo">↷</button>
    <button id="helpBtn" class="ib" aria-label="Help">?</button>
    <button id="shareBtn" class="ib accent" aria-label="Share / export">⇪ <span class="hide-sm">Share</span></button>
  </header>
  <nav id="views">
    <button data-v="plan" class="on">2D Plan</button><button data-v="3d">3D</button><button data-v="walk">Walk</button><button data-v="photo">Photo</button>
    <button id="splitBtn" class="splitb" title="Plan + 3D side by side">◫</button>
  </nav>
  <main id="stage">
    <canvas id="plan"></canvas>
    <div id="v3d"></div>
    <canvas id="photo"></canvas>
    <div id="hint"></div>
    <div id="draftbar" style="display:none"></div>
    <div id="ctxbar" style="display:none"></div>
    <div id="joy"><i></i></div>
  </main>
  <div id="totals"></div>
  <footer id="dock"></footer>
  <section id="sheet" class="sheet"></section>
  <div id="modal"></div>
  <div id="toast"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
